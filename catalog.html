<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">ACDC</div>
    <button class="burger-menu" id="burgerMenu">
      <span></span><span></span><span></span>
    </button>
    <nav class="menu" id="navMenu">
      <a href="index.html" class="menu-link">Главная</a>
      <a href="catalog.html" class="menu-link">Каталог</a>
      <a href="about.html" class="menu-link">О нас</a>
      <a href="contacts.html" class="menu-link">Контакты</a>
      <a href="#" class="menu-link" id="cart-link">Корзина: <span id="cart-count">0</span></a>
    </nav>
  </header>

  <div class="main-content">
    <h1 style="color: white; text-align: center; width: 100%; margin-bottom: 20px;">Наш каталог</h1>
    
    <div class="catalog-grid">
      <div class="catalog-item">
        <img src="tv.png" alt="Телевизор" style="width: 100%; height: 150px; object-fit: cover; border-radius: 8px;">
        <h3>Телевизор Hisense</h3>
        <p class="price">79 999 ₽</p>
        <button class="buy-btn" data-name="Телевизор Hisense" data-price="79999">Купить</button>
      </div>
      <div class="catalog-item">
        <div style="background: #ddd; height: 150px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 40px;">💻</div>
        <h3>Ноутбук ASUS</h3>
        <p class="price">65 000 ₽</p>
        <button class="buy-btn" data-name="Ноутбук ASUS" data-price="65000">Купить</button>
      </div>
      <div class="catalog-item">
        <div style="background: #ddd; height: 150px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 40px;">📱</div>
        <h3>Смартфон iPhone</h3>
        <p class="price">99 000 ₽</p>
        <button class="buy-btn" data-name="Смартфон iPhone" data-price="99000">Купить</button>
      </div>
      <div class="catalog-item">
        <div style="background: #ddd; height: 150px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 40px;">🎧</div>
        <h3>Наушники Sony</h3>
        <p class="price">15 000 ₽</p>
        <button class="buy-btn" data-name="Наушники Sony" data-price="15000">Купить</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>© 2024 ACDC Shop. Все права защищены.</p>
  </footer>
  <div id="toast-container"></div>
  <script src="script.js"></script>
</body>
</html>
