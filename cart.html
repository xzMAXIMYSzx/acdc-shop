<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">ACDC</div>
    <button class="burger-menu" id="burgerMenu">
      <span></span><span></span><span></span>
    </button>
    <nav class="menu" id="navMenu">
      <a href="index.html" class="menu-link">Главная</a>
      <a href="catalog.html" class="menu-link">Каталог</a>
      <a href="about.html" class="menu-link">О нас</a>
      <a href="contacts.html" class="menu-link">Контакты</a>
      <a href="cart.html" class="menu-link" id="cart-link">Корзина: <span id="cart-count">0</span></a>
    </nav>
  </header>

  <div class="main-content">
    <div class="product-card" style="width: 600px; animation: none;">
      <h2>Ваша корзина</h2>
      <div id="cart-items" style="margin-top: 20px;"></div>
      
      <div id="cart-total" style="text-align: right; font-size: 20px; font-weight: bold; margin-top: 20px; color: #f05a28; display: none;">
        Итого: 0 ₽
      </div>

      <button id="clear-cart-btn" class="buy-btn" style="width: 100%; margin-top: 20px; display: none;">Очистить корзину</button>
      
      <!-- НОВАЯ КНОПКА ОФОРМЛЕНИЯ ЗАКАЗА -->
      <button id="checkout-btn" class="buy-btn" style="width: 100%; margin-top: 10px; background-color: #2ecc71; display: none;">Оформить заказ</button>
    </div>
  </div>

  <footer class="site-footer">
    <p>© 2024 ACDC Shop. Все права защищены.</p>
  </footer>
  
  <div id="toast-container"></div>
  <script src="script.js"></script>
</body>
</html>
